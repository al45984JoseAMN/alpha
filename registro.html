<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>αlpha — Registro</title>
    <style type="text/css">
        /* ================================================= */
        /* VARIABLES DEL MODO OSCURO                         */
        /* ================================================= */
        :root {
            --bg-color: #f5f6fa;
            --text-color: #2f3542;
            --card-bg: #ffffff;
            --border-color: #e4e7eb;
            --accent-color: #f383db;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --input-bg: #f9f9f9;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
            --input-bg: #252525;
        }

        /* ================================================= */
        /* ESTILOS GENERALES                                 */
        /* ================================================= */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            font-size: 40px;
            margin-bottom: 20px;
        }

        /* Botón de Modo Oscuro idéntico al de αlpha */
        .btn-modo {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            z-index: 1000;
        }

        body.dark-mode .btn-modo {
            background-color: #ffffff;
            color: #121212;
        }

        /* Enlace para volver */
        .link-retorno {
            align-self: flex-start;
            margin: 0 auto 20px auto;
            max-width: 600px;
            width: 100%;
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        .link-retorno:hover {
            text-decoration: underline;
        }

        /* ================================================= */
        /* CONTENEDOR DEL FORMULARIO (Estilo Tarjeta Alpha)  */
        /* ================================================= */
        .card-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            margin: 0 auto 40px auto;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow);
            box-sizing: border-box;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--accent-color);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s, background-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .form-helper {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* Estilos para los Radio Buttons */
        .radio-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .radio-option input[type="radio"] {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .radio-option label {
            color: var(--text-color);
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        /* Checkbox de términos */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .checkbox-group input {
            margin-top: 3px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .checkbox-group label {
            color: var(--text-color);
            font-weight: normal;
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 0;
        }

        /* Botón de Enviar */
        .btn-enviar {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }

        .btn-enviar:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="dark-mode">

    <!-- Botón de Modo Oscuro -->
    <button class="btn-modo" id="btnModo" onclick="toggleModoOscuro()">Modo Claro</button>

    <!-- Enlace para volver a la página principal -->
    <a href="index.html" class="link-retorno">&larr; Volver al inicio</a>

    <h1>Registro</h1>

    <div class="card-container">
        <form id="formRegistro">
            
            <div class="form-group">
                <label for="nombre">Identificador / Alias</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre o apodo...">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="razon">Propósito del Registro</label>
                <select id="razon" name="razon">
                    <option value="general">Suscripción general a novedades</option>
                    <option value="demo">Envío de material o demo</option>
                    <option value="colaboracion">Propuesta de colaboración</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nivel de Acceso Preferido</label>
                <div class="radio-container">
                    <div class="radio-option">
                        <input type="radio" id="nivel-basico" name="nivel_acceso" value="basico" checked>
                        <label for="nivel-basico">Básico (Solo lectura)</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="nivel-avanzado" name="nivel_acceso" value="avanzado">
                        <label for="nivel-avanzado">Avanzado (Acceso a demos)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="mensaje">Notas Adicionales (Opcional)</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe detalles adicionales..."></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepto los términos, condiciones y normativas internas de αlpha.</label>
            </div>

            <button type="submit" class="btn-enviar">Completar Registro</button>

        </form>
    </div>

    <script>
        // Función de Modo Oscuro
        function toggleModoOscuro() {
            const body = document.body;
            const btn = document.getElementById('btnModo');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.textContent = 'Modo Claro';
            } else {
                btn.textContent = 'Modo Oscuro';
            }
        }

        // Manejo del formulario con alerta nativa y redirección
        document.getElementById('formRegistro').addEventListener('submit', function(event) {
            // Evita que la página se recargue de forma convencional
            event.preventDefault();

            // Muestra la alerta nativa del navegador con tu mensaje
            alert("Ahora eres parte de la frecuencia alpha");

            // Redirige automáticamente al index cuando el usuario cierre la alerta
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>αlpha — Registro</title>
    <link rel="stylesheet" href="registro-style.css">
    <style type="text/css">
      
    </style>
</head>
<body class="dark-mode">

    <!-- Botón de Modo Oscuro -->
    <button class="btn-modo" id="btnModo" onclick="toggleModoOscuro()">Modo Claro</button>

    <!-- Enlace para volver a la página principal -->
    <a href="index.html" class="link-retorno">&larr; Volver al inicio</a>

    <h1>Registro</h1>

    <div class="card-container">
        <form id="formRegistro">
            
            <div class="form-group">
                <label for="nombre">Identificador / Alias</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre o apodo...">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="razon">Propósito del Registro</label>
                <select id="razon" name="razon">
                    <option value="general">Suscripción general a novedades</option>
                    <option value="demo">Envío de material o demo</option>
                    <option value="colaboracion">Propuesta de colaboración</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nivel de Acceso Preferido</label>
                <div class="radio-container">
                    <div class="radio-option">
                        <input type="radio" id="nivel-basico" name="nivel_acceso" value="basico" checked>
                        <label for="nivel-basico">Básico (Solo lectura)</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="nivel-avanzado" name="nivel_acceso" value="avanzado">
                        <label for="nivel-avanzado">Avanzado (Acceso a demos)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="mensaje">Notas Adicionales (Opcional)</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe detalles adicionales..."></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepto los términos, condiciones y normativas internas de αlpha.</label>
            </div>

            <button type="submit" class="btn-enviar">Completar Registro</button>

        </form>
    </div>

    <script src="registro-script.js"></script>
</body>
</html>
